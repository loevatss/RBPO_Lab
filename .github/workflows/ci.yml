name: CI

on:
  push:
    branches: ["laba6", "main", "master"]
  pull_request:

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring-social

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Build & test
        run: mvn -B clean test

      - name: Package (jar)
        run: mvn -B package -DskipTests

      - name: Upload artifact (jar)
        uses: actions/upload-artifact@v4
        with:
          name: spring-social-jar
          path: spring-social/target/*.jar
