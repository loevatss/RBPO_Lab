name: CI

on:
  push:
    branches: ["laba6", "main", "master"]
  pull_request:

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring-social

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
      - name: Restore server.jks from secret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/main/resources
          echo "${{ secrets.SERVER_JKS_B64 }}" | base64 -d > src/main/resources/server.jks
          test -s src/main/resources/server.jks
          ls -la src/main/resources/server.jks

      - name: Build & test
        env:
          SSL_KEYSTORE_PASSWORD: ${{ secrets.SLL_KEYSTORE_PASSWORD }}
        run: mvn -B clean test

      - name: Package (jar)
        env:
          SSL_KEYSTORE_PASSWORD: ${{ secrets.SLL_KEYSTORE_PASSWORD }}
        run: mvn -B package

      - name: Upload artifact (jar)
        uses: actions/upload-artifact@v4
        with:
          name: spring-social-jar
          path: spring-social/target/*.jar
