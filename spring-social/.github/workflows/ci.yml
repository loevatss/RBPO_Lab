name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Build & test
        run: mvn -B clean test

      - name: Package (jar)
        run: mvn -B package -DskipTests

      # Восстанавливаем server.jks из GitHub Secrets (НЕ коммитим в репо!)
      - name: Restore keystore from secrets
        shell: bash
        run: |
          echo "${{ secrets.SERVER_JKS_B64 }}" | base64 -d > server.jks
          ls -la server.jks

      # Проверка, что пароль приходит как secret, и путь задаётся env
      - name: Smoke run (HTTPS config check)
        shell: bash
        env:
          SSL_KEYSTORE_PASSWORD: ${{ secrets.SSL_KEYSTORE_PASSWORD }}
          SSL_KEYSTORE_PATH: file:./server.jks
        run: |
          java -jar target/*.jar --spring.main.web-application-type=none || true

      - name: Upload artifact (jar)
        uses: actions/upload-artifact@v4
        with:
          name: spring-social-jar
          path: target/*.jar
