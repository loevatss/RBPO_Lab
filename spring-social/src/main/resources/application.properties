spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:50000}/${POSTGRES_DB:admin_bd}
spring.datasource.username=${POSTGRES_USER:admin}
spring.datasource.password=${POSTGRES_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Initialize SQL scripts (data.sql) after JPA creates schema
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

